<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bashmath Academy</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f7fb;
        }

        nav{
            background:#0A2E73;
            color:white;
            padding:15px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
        }

        .hero{
            min-height:90vh;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:50px 8%;
            gap:40px;
        }

        .hero-text{
            flex:1;
        }

        .hero-text h1{
            font-size:55px;
            color:#0A2E73;
            margin-bottom:20px;
        }

        .hero-text p{
            font-size:20px;
            line-height:1.8;
            margin-bottom:25px;
        }

        .btn{
            display:inline-block;
            padding:15px 30px;
            background:#D72638;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }

        .hero-image{
            flex:1;
            text-align:center;
        }

        .hero-image img{
            width:350px;
            border-radius:20px;
        }

        footer{
            background:#0A2E73;
            color:white;
            text-align:center;
            padding:20px;
        }

        @media(max-width:768px){
            .hero{
                flex-direction:column;
                text-align:center;
            }

            .hero-text h1{
                font-size:38px;
            }

            .hero-image img{
                width:280px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">BASHMATH ACADEMY</div>
</nav>

<section class="hero">

    <div class="hero-text">
        <h1>Guiding Today • Empowering Tomorrow</h1>

        <p>
            Welcome to Bashmath Academy. We prepare students for
            WAEC, NECO, JAMB, Post-UTME and A-Level examinations
            through quality teaching, mentorship and innovative learning.
        </p>

        <a href="#" class="btn">Enroll Now</a>
    </div>

    <div class="hero-image">
        <img src="file_0000000551871f4a04878ceda80342c.png" alt="Bashmath Academy Logo">
    </div>

</section>

<footer>
    © 2026 Bashmath Academy. All Rights Reserved.
</footer>

</body>
          </html>
